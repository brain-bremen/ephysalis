# Builds the Sphinx documentation (docs/) and publishes it on GitHub Pages:
# https://brain-bremen.github.io/ephysalis/

name: Documentation

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Set up Python
      run: uv python install
    - name: Install the project
      run: uv sync --group docs
    - name: Build the documentation
      run: uv run sphinx-build -W --keep-going -q docs docs/_build
    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
