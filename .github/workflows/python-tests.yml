# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Set up Python
      run: uv python install
    - name: Install Qt system libraries (offscreen GUI tests)
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install the project
      run: uv sync --group dev
    - name: Get the Open Ephys format test recordings (open-ephys-python-tools)
      run: |
        git init -q "$RUNNER_TEMP/oept"
        git -C "$RUNNER_TEMP/oept" fetch -q --depth 1 https://github.com/open-ephys/open-ephys-python-tools.git 4032c290bbfde85320dc95ab53e83251cdae7edb
        git -C "$RUNNER_TEMP/oept" checkout -q FETCH_HEAD
        echo "OPEN_EPHYS_TOOLS_TEST_DATA=$RUNNER_TEMP/oept/tests/data" >> "$GITHUB_ENV"
    - name: Run tests
      run: uv run pytest tests

