[project]
name = "ephyscon"
version = "0.3.0.dev0"
description = "Preprocessing of extracellular electrophysiology recordings (Open Ephys, SpikeGLX) to DH5 and NWB (successor of oecon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dh5io>=0.4.1",
    "scipy>=1.15.2",
    "numpy>2.0",
    "vstim>=0.2.0",
    "pydantic>=2.0",
    "pyside6>=6.7",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "h5py>=3.12",
    "neo>=0.14.6",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "probeinterface>=0.4.2",
    "pymatreader>=1.3.2",
    "spikeinterface>=0.105.3",
    "tomli-w>=1.2",
    "pynwb>=3.0",
    "open-ephys-python-tools>=1.0.1",
]

[project.optional-dependencies]
# Spike sorting with Kilosort4 (needs an NVIDIA GPU; torch comes from the CUDA index below)
sorting = [
    "kilosort>=4.1",
    "torch>=2.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[dependency-groups]
dev = [
    "bids-validator-deno>=3.0.2",
    "mypy>=1.16.1",
    "nwbinspector>=0.7.2",
    "pytest>=8.3.5",
    "pytest-plt>=1.1.1",
    "scipy-stubs>=1.15.3.0",
]


[project.scripts]
ephyscon = "ephyscon.cli.main:main"
ephyscon-gui = "ephyscon.gui.app:main"
ephyscon-inspect = "ephyscon.gui.inspector_app:main"

# Plugin registries. Other packages can register additional input formats or
# stimulus systems under the same entry point groups.
[project.entry-points."ephyscon.input_formats"]
spikeglx = "ephyscon.io.spikeglx:SpikeGLXFormat"
openephys = "ephyscon.io.openephys:OpenEphysFormat"
daq = "ephyscon.io.daq:DaqFormat"

[project.entry-points."ephyscon.stimulus_systems"]
stimstage = "ephyscon.stimulus.stimstage:StimStageSystem"
vstim = "ephyscon.stimulus.vstim:VStimSystem"

[tool.pytest.ini_options]
markers = [
    "realdata: tests that need a real recording session (set EPHYSCON_TEST_SESSION)",
]
