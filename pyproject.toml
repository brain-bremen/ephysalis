[project]
name = "ephyscon"
version = "0.3.0.dev0"
description = "Preprocessing of extracellular electrophysiology recordings (Open Ephys, SpikeGLX) to DH5 and NWB (successor of oecon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dh5io>=0.4.1",
    "open-ephys-python-tools",
    "scipy>=1.15.2",
    "numpy>2.0",
    "vstim>=0.1.0",
    "psutil>=7.2.2",
    "pydantic>=2.0",
    "pyside6>=6.7",
    "tqdm>=4.67.3",
    "comtypes>=1.4.0; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true


[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pytest>=8.3.5",
    "pytest-plt>=1.1.1",
    "scipy-stubs>=1.15.3.0",
    "types-tqdm>=4.67.3.20260303",
]


[project.scripts]
ephyscon = "ephyscon.cli.main:main"
ephyscon-gui = "ephyscon.gui.app:main"
ephyscon-inspect = "ephyscon.gui.inspector_app:main"
